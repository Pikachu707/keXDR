<svg width="740" height="220" viewBox="0 0 740 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- flat light card -->
  <rect x="1" y="1" width="738" height="218" rx="20" fill="#f8fafc"/>
  <rect x="1.5" y="1.5" width="737" height="217" rx="19.5" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- emblem: shield with a crossing kernel/network "X" cut as negative space -->
  <g transform="translate(38,30)">
    <path d="M 80 0 L 160 26 L 160 92 C 160 138 126 172 80 190 C 34 172 0 138 0 92 L 0 26 Z"
          fill="url(#shieldGrad)"/>
    <!-- negative-space X (kernel <-> network crossing) -->
    <g stroke="#f8fafc" stroke-width="10" stroke-linecap="round">
      <line x1="42" y1="52" x2="118" y2="126"/>
      <line x1="118" y1="52" x2="42" y2="126"/>
    </g>
    <!-- single accent node marking the reconstructed root cause -->
    <circle cx="80" cy="89" r="9" fill="#22d3ee"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(250,0)">
    <text x="0" y="110" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="0.5" fill="#0f172a">ke<tspan fill="#0891b2">X</tspan>DR</text>
    <text x="3" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#64748b">KERNEL-NATIVE HOST-NETWORK COLLABORATIVE</text>
    <text x="3" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#64748b">ATTACK PROVENANCE</text>
    <rect x="3" y="178" width="60" height="6" rx="3" fill="#0f172a"/>
    <rect x="67" y="178" width="60" height="6" rx="3" fill="#22d3ee"/>
  </g>
</svg>
